<section id="login-component" class="card">
    <h2>Login</h2>
    <form id="login-form">
    <label>
    Email
    <input type="email" id="login-email" required />
    </label>
    <label>
    Password
    <input type="password" id="login-password" required />
    </label>
    <div class="row">
    <button type="submit">Login</button>
    <button type="button" id="go-signup">Create account</button>
    </div>
    <p id="login-error" class="error"></p>
    </form>
    </section>
